stages:
  - check

lint-and-test:
  stage: check
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: tracker
    POSTGRES_PASSWORD: tracker
    POSTGRES_DB: prices_test
    TEST_DATABASE_URL: postgresql+asyncpg://tracker:tracker@postgres:5432/prices_test
    UV_CACHE_DIR: .uv-cache
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - pip install --quiet uv==0.11.21
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy deribit_tracker tests
    - uv run pytest
