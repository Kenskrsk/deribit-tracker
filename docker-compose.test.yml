# Throwaway PostgreSQL for integration tests: `make test`.
name: deribit-tracker-test
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: prices_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tracker -d prices_test"]
      interval: 2s
      timeout: 3s
      retries: 15
